services:

  backend:
    image: ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}-backend:${IMAGE_TAG}
    container_name: devops-backend-prod
    ports:
      - "5000:5000"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}-frontend:${IMAGE_TAG}
    container_name: devops-frontend-prod
    ports:
      - "8080:80"
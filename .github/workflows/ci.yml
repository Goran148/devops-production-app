name: CI

permissions:
  contents: read
  packages: write

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    frontend:
        name: Frontend CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Build frontend
              working-directory: frontend
              run: npm run build

    backend:
      name: Backend CI
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install backend dependencies
          working-directory: backend
          run: pip install -r requirements.txt

        - name: Run backend tests
          working-directory: backend
          run: pytest

    docker:
      name: Docker Build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Log in to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker Image
          run: docker compose build

        - name: Build and push backend image
          run: |
            docker build \
              -t ghcr.io/${{ github.repository }}-backend:${{ github.sha }} \
              ./backend
            docker push ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

        - name: Build and push frontend image
          run: |
            docker build \
              -t ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} \
              ./frontend
            docker push ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}

    integration:
      name: Integration Test
      runs-on: ubuntu-latest

      env:
        POSTGRES_DB: appdb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Start application
          run: docker compose up -d

        - name: Wait for database
          run: |
            for i in {1..30}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' devops-database 2>/dev/null || true)

              echo "Database status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "Database is healthy"
                exit 0
              fi

              sleep 2
            done

            echo "Database did not become healthy"
            docker compose logs database
            exit 1

        - name: Wait for backend
          run: |
            for i in {1..30}; do
              if curl --fail http://localhost:5000/health; then
                echo "Backend is healthy"
                exit 0
              fi

              echo "Backend is not ready yet..."
              sleep 2
            done

            echo "Backend did not become healthy"
            docker compose logs backend
            exit 1

        - name: Test database connection
          run: curl --fail http://localhost:5000/api/database

        - name: Show containers
          if: always()
          run: docker compose ps

        - name: Show logs
          if: always()
          run: docker compose logs
          
    deploy:
        name: Deploy to EC2
        needs: docker
        runs-on: ubuntu-latest

        steps:
          - name: Deploy application
            uses: appleboy/ssh-action@v1.2.5
            with:
              host: ${{ secrets.EC2_HOST }}
              username: ${{ secrets.EC2_USER }}
              key: ${{ secrets.EC2_SSH_KEY }}
              script: |
                cd ~/devops-production-app
                CURRENT_TAG=$(GREP '^IMAGE_TAG=' .env | cut -d '=' -f2)
                
                echo "Current image tag: $CURRENT_TAG"
                echo "New image tag: ${{ github.sha }}"
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
                docker compose -f docker-compose.prod.yml pull
                docker compose -f docker-compose.prod.yml up -d
                sleep 10
                if ! curl --fail http://localhost/api/health; then
                  echo "Health check failed!"
                  echo "Rolling back to $CURRENT_TAG"

                  sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$CYRRENT_TAG/" .env
                  docker compose -f docker-compose.prod.yml pull
                  docker compose -f docker-compose.prod.yml up -d
                  exit 1
                fi
                echo "Deployment successful!"
                docker compose -f docker-compose.prod.yml ps